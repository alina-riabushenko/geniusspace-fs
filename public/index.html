<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullstack Course - Task Manager</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Fullstack Course Task Manager</h1>
            <p class="subtitle">A simple task management application built with Node.js, Express, and Vanilla JavaScript</p>
        </header>

        <main>
            <section class="add-task-section">
                <h2>Add New Task</h2>
                <div class="input-group">
                    <input type="text" id="taskInput" placeholder="Enter a new task..." />
                    <button id="addTaskBtn" class="btn btn-primary">Add Task</button>
                </div>
            </section>

            <section class="tasks-section">
                <h2>Your Tasks</h2>
                <div id="tasksList" class="tasks-list">
                    <div class="loading">Loading tasks...</div>
                </div>
            </section>
        </main>

        <footer>
            <p>Built with ❤️ for Fullstack Course | © 2025</p>
        </footer>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
